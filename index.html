<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>AtomiX</title>
<style>
  /* Phase 1 smoke shell — the full pixel-parity UI lands in Phase 2. Dark ground so the boot screen matches. */
  html, body { margin: 0; background: #0B0D12; color: #EEF0F4; font-family: -apple-system, system-ui, sans-serif; }
  #boot { padding: 24px 16px; }
  #boot h1 { font-size: 21px; letter-spacing: -0.01em; margin: 0 0 4px; }
  #boot .sub { color: #8B909C; font-size: 12px; }
  #log { margin-top: 16px; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; white-space: pre-wrap; color: #8B909C; }
  #log .ok { color: #3FD0A2; } #log .err { color: #FF5C5C; }
</style>
</head>
<body>
<div id="boot">
  <h1>AtomiX</h1>
  <div class="sub">v0.0.1 · Phase 1 · initialising…</div>
  <div id="log"></div>
</div>

<script src="mds.js"></script>
<script src="lib/rhino_shim.js"></script>
<script src="vendor/nacl.js"></script>
<script src="vendor/blake.js"></script>
<script src="vendor/sha256.js"></script>
<script src="vendor/sha512.js"></script>
<script src="vendor/sha3.js"></script>
<script src="vendor/elliptic.js"></script>
<script src="lib/hex.js"></script>
<script src="lib/flow.js"></script>
<script src="crypto/ax_sodium.js"></script>
<script src="crypto/ax_eth.js"></script>
<script src="lib/identity.js"></script>
<script src="lib/trading.js"></script>
<script src="lib/mds.js"></script>
<script src="lib/htlc.js"></script>
<script src="lib/prng.js"></script>
<script src="lib/boot.js"></script>
<script>
  var logEl = document.getElementById('log');
  function line(s, cls) { logEl.innerHTML += '<div' + (cls ? ' class="' + cls + '"' : '') + '>' + s + '</div>'; }
  MDS.init(function (msg) {
    if (msg.event !== 'inited') return;
    line('MDS inited — deriving identity…');
    AX.boot.init(function (err, ctx) {
      if (err) { line('✗ ' + err.message, 'err'); return; }
      var mx = ctx.identities.mxusdt, mn = ctx.identities.minima;
      line('✓ mxUSDT id  ' + mx.publicId().slice(0, 22) + '…', 'ok');
      line('✓ MINIMA id  ' + mn.publicId().slice(0, 22) + '…', 'ok');
      line('✓ ETH addr   ' + ctx.eth.address, 'ok');
      line('✓ HTLC addr  ' + ctx.htlc.address.slice(0, 20) + '…  (script registered)', 'ok');
      line('✓ swap key   ' + (ctx.htlc.publickey || '').slice(0, 22) + '…', 'ok');
      line('\nPhase 1 identity ready. UI + trading land in Phase 2+.', 'ok');
    });
  });
</script>
</body>
</html>
