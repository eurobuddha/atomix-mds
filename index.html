<!DOCTYPE html>
<html lang="en" data-theme="dark" data-ccy="mxusdt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>AtomiX</title>
<link rel="stylesheet" href="assets/style.css" />
<style>
  #toast { position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--surface2); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 13px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: 80%; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #root:empty::after { content: 'AtomiX'; display: block; padding: 40px 16px; color: var(--dim); font-size: 21px; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>

<script src="mds.js"></script>
<script src="lib/rhino_shim.js"></script>
<script src="vendor/nacl.js"></script>
<script src="vendor/blake.js"></script>
<script src="vendor/sha256.js"></script>
<script src="vendor/sha512.js"></script>
<script src="vendor/sha3.js"></script>
<script src="vendor/elliptic.js"></script>
<script src="lib/hex.js"></script>
<script src="lib/flow.js"></script>
<script src="crypto/ax_sodium.js"></script>
<script src="crypto/ax_eth.js"></script>
<script src="lib/decimal.js"></script>
<script src="lib/abi.js"></script>
<script src="lib/ethhtlc.js"></script>
<script src="lib/identity.js"></script>
<script src="lib/trading.js"></script>
<script src="lib/mdsw.js"></script>
<script src="lib/ethrpc.js"></script>
<script src="lib/ethtx.js"></script>
<script src="lib/ethops.js"></script>
<script src="lib/swapdb.js"></script>
<script src="lib/take.js"></script>
<script src="lib/htlc.js"></script>
<script src="lib/prng.js"></script>
<script src="lib/boot.js"></script>
<script src="lib/order.js"></script>
<script src="lib/orderbook.js"></script>
<script src="lib/swapplan.js"></script>
<script src="lib/peg.js"></script>
<script src="lib/maker.js"></script>
<script src="lib/fmt.js"></script>
<script src="lib/ui.js"></script>
<script src="lib/engine.js"></script>
<script src="lib/otc.js"></script>
<script src="lib/app.js"></script>
<script>
  MDS.init(function (msg) {
    if (msg.event === 'inited') AX.app.start();
    else if (msg.event === 'NEWBLOCK') { if (AX.ui.state.ctx) { AX.ui.block = parseInt(msg.data.txpow.header.block); } }
    else if (msg.event === 'NEWBALANCE') { if (AX.ui.state.ctx && AX.app.onBalance) AX.app.onBalance(); }
  });
</script>
</body>
</html>
